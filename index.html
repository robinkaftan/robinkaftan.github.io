<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Robin Kaftan</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="./assets/icons/logo.png">
        <link rel="preload" href="./assets/slices/greencontainer.png" as="image">
        <link rel="preload" href="./assets/slices/bluecontainer.png" as="image">
        <link rel="preload" href="./assets/slices/hallocontainer.png" as="image">
        <link rel="preload" href="./assets/slices/jollycontainer.png" as="image">
        <link rel="preload" href="./assets/sprites/logo.png" as="image">
        <link rel="preload" href="./assets/sprites/logodark.png" as="image">
        <link rel="preload" href="./assets/icons/speaker.png" as="image">
        <link rel="preload" href="./assets/icons/cog.png" as="image">
        <link rel="preload" href="./scrungly.ttf" as="font">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="mobile-overlay">
            <div class="mobile-warning">
                <h1>Hello, mobile user!</h1>
                <p>
                    It seems you are running a device that is taller than it is wide.<br>
                    This website IS optimised for mobile. Please acknowledge that it isn't actively developed to be mobile supported.<br>
                </p>
                <button onclick='document.querySelectorAll(".mobile-overlay").forEach(el => el.remove());'>Okay, okay, I get it.</button>
            </div>
        </div>
        <nav class="topbar">
            <img src="./assets/sprites/logo.png" class="logo" alt="Logo">
            <div class="nav-container">
                <a class="topbar-entry nav-link" href="home.html">Home</a>
                <a class="topbar-entry nav-link" href="projects.html">Projects</a>
                <a class="topbar-entry nav-link" href="about.html">About</a>
                <a class="topbar-entry nav-link" href="archive.html">Archive</a>
                <a class="topbar-entry nav-link" href="contact.html">Contact</a>
            </div>

            <a class="topbar-readaloud" title="Read Aloud"><img class="cog" src="./assets/icons/speaker.png"></a>
            <a class="topbar-cog nav-link" href="settings.html" title="Settings"><img class="cog" src="./assets/icons/cog.png"></a>
        </nav>
        <main class="iframe-container">
            <iframe sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation" name="mainframe" src="home.html"></iframe>
        </main>
        <aside class="artwork-container">
            <div class="artwork-section">
                <img class="artwork" id="coolArt" alt="There's supposed to be a picture here... Refresh your page or check connection." title="cool art" src="./assets/placeholder.png">
            </div>
            <h6 class="artwork-text">Newest Artwork</h6>
        </aside>
    </body>
</html>
